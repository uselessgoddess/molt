name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test, benchmark build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - run: just pre

  atomics:
    name: Test on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
          - name: aarch64-macos
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --package molt-core

  miri:
    name: Miri
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: miri
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just miri

  loom:
    name: Loom
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'loom')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just loom

  fuzz:
    name: Fuzz the wire parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-fuzz
      - run: just fuzz 60
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore

  boot:
    name: Build images and boot in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-misc
      - run: just smoke
      - name: Boot in QEMU with tagged translation
        run: |
          # TCG does not model PCIDs, so this boot runs on the host's own cores.
          # Both halves of that are hard failures rather than skips: `xtask`
          # expects `bits=0` when either is missing, so a runner that cannot
          # prove tagged translation would otherwise agree with itself and pass.
          if [ ! -e /dev/kvm ]; then
            echo "::error::no /dev/kvm on this runner: PCIDs cannot be proven"
            exit 1
          fi
          # The same rule `xtask`'s `tag_marker` reads the flag by, so the guard
          # and the expectation cannot disagree about what this host offers.
          if ! grep -qE '(^|[^[:alnum:]])pcid([^[:alnum:]]|$)' /proc/cpuinfo; then
            echo "::error::host CPU reports no pcid: PCIDs cannot be proven"
            exit 1
          fi
          # The device is root:kvm 0660 and the runner is not in that group.
          # `udevadm trigger` only queues the event, so a readability test on the
          # next line races the daemon that applies the rule; chmod returns with
          # the change already made.
          sudo chmod 0666 /dev/kvm
          MOLT_QEMU_ACCEL=kvm just smoke-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: molt-x86_64-images
          path: target/molt/*.img
          if-no-files-found: error
