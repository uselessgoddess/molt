name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test, benchmark build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - run: just pre

  atomics:
    name: Test on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
          - name: aarch64-macos
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --package molt-core

  miri:
    name: Miri
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: miri
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just miri

  loom:
    name: Loom
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'loom')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just loom

  fuzz:
    name: Fuzz the wire parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-fuzz
      # A minute per target finds nothing most days, which is the point: the run
      # is here so that a mutation reaching a new branch is noticed on the commit
      # that added it, not months later.
      - run: just fuzz 60
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore

  boot:
    name: Build images and boot in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-misc
      - run: just smoke
      # The run that proves tagged translation. QEMU's TCG implements no PCIDs
      # whatever `-cpu` is asked for, so the smoke above can only show the port
      # booting with `CR4.PCIDE` off and a flush per switch; a KVM guest on a
      # host that has them is where `MOLT_ASID_OK: bits=12` can be read at all.
      # The udev rule is what makes `/dev/kvm` the runner's own group readable.
      - name: Boot in QEMU with tagged translation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -r /dev/kvm ]; then
            echo "::error::no readable /dev/kvm: PCIDs cannot be proven on this runner"
            exit 1
          fi
          MOLT_QEMU_ACCEL=kvm just smoke-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: molt-x86_64-images
          path: target/molt/*.img
          if-no-files-found: error
