[workspace]
resolver = "3"
# A group under `crates/` is a level in the dependency graph: a package there
# may only reach into groups below its own. Adding one is creating a directory,
# not editing this list.
members = ["crates/*/*", "userspace/*", "kernel", "xtask"]
# The kernel is the one member a host cannot build, so it is the one exclusion.
default-members = ["crates/*/*", "userspace/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
churn = { path = "crates/base/churn" }
limen = { path = "crates/base/limen" }
molt-abi = { path = "crates/base/abi" }
molt-alloc = { path = "crates/base/alloc" }
molt-arch = { path = "crates/sys/arch" }
molt-block = { path = "crates/storage/block" }
molt-core = { path = "crates/sys/core" }
molt-domain = { path = "crates/sys/domain" }
molt-fs = { path = "crates/storage/fs", default-features = false }
molt-net = { path = "crates/stack/net" }
molt-nvme = { path = "crates/device/nvme" }
molt-pci = { path = "crates/device/pci" }
molt-riscv = { path = "crates/platform/riscv" }
molt-rt = { path = "crates/sys/rt" }
molt-shell = { path = "crates/user/shell" }
molt-user = { path = "crates/user/runtime" }
molt-tcp = { path = "crates/stack/tcp" }
molt-udp = { path = "crates/stack/udp" }
molt-virtio = { path = "crates/device/virtio" }
molt-x86_64 = { path = "crates/platform/x86_64" }
spin = { version = "0.12.2", default-features = false, features = ["once"] }
# Only ever a dev-dependency: the property sweeps generate their moves with it
# and shrink a counterexample down to the shortest list that still fails.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
smoltcp = { version = "0.13.1", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
] }

bootloader_api = "0.11.15"
x86_64 = { version = "0.15.5", default-features = false, features = [
    "abi_x86_interrupt",
    "instructions",
] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.loom]
inherits = "test"
opt-level = 2

[profile.micro]
inherits = "release"
codegen-units = 1
opt-level = 3
lto = true
strip = true

[profile.nano]
inherits = "micro"
opt-level = "z"
panic = "abort"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
missing_safety_doc = { level = "warn" }
undocumented_unsafe_blocks = { level = "warn" }
